server:
  port: 8080
  error:
    include-stacktrace: on_param
    include-exception: false
    include-message: always
    include-binding-errors: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yml

logging:
  level:
    com.example.bankcards: DEBUG
    org.springframework.boot: INFO
    org.springframework.context: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type: INFO
    com.fasterxml.jackson.databind: INFO


  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}
  salt: ${ENCRYPTION_SALT}
  algorithm: AES/CBC/PKCS5Padding

cors:
  allowed-origins: "http://localhost:3000,http://localhost:4200,http://localhost:8081"
  allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allowed-headers: "Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers"
  exposed-headers: "Authorization,Content-Type,Content-Disposition"
  allow-credentials: true
  max-age: 3600