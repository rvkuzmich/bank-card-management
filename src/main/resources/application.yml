server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_card
    username: admin
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yml
    user: admin
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://localhost:5432/db_card

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}
  salt: ${ENCRYPTION_SALT}
  algorithm: AES/CBC/PKCS5Padding

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:4200"
    - "http://localhost:8081"
    - "https://bankcard-frontend.com"
  allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
  allowed-headers: Authorization, Content-Type, X-Requested-With, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers
  exposed-headers: Authorization, Content-Type, Content-Disposition
  allow-credentials: true
  max-age: 3600