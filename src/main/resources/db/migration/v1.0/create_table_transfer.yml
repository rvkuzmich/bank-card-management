databaseChangeLog:
  - changeSet:
      id: create_table_transfer
      author: Roman Kuzmich
      comment: Создание таблицы банковских переводов
      preConditions:
        - not:
            - tableExists:
                tableName: transfers
        - tableExists:
            tableName: cards

      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: ID перевода

              - column:
                  name: from_card_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_from_card
                    referencedTableName: cards
                    referencedColumnNames: id
                  remarks: ID карты, с которой осуществляется перевод

              - column:
                  name: to_card_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_to_card
                    referencedTableName: cards
                    referencedColumnNames: id
                  remarks: ID карты, на которую осуществляется перевод

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
                  remarks: Сумма перевода

              - column:
                  name: description
                  type: VARCHAR(255)
                  remarks: Описание перевода

              - column:
                  name: timestamp
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Временная метка перевода

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_from_card
            columns:
              - column:
                  name: from_card_id
            remarks: Индекс для быстрого поиска переводов по карте-источнику

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_to_card
            columns:
              - column:
                  name: to_card_id
            remarks: Индекс для быстрого поиска переводов по карте-назначению

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_timestamp
            columns:
              - column:
                  name: timestamp
            remarks: Индекс для быстрого поиска переводов по временной метке

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_from_card_timestamp
            columns:
              - column:
                  name: from_card_id
              - column:
                  name: timestamp
            remarks: Индекс для поиска переводов по карте-источнику и временной метке