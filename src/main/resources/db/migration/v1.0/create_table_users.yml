databaseChangeLog:
  - changeSet:
      id: create_table_users
      author: Roman Kuzmich
      comment: Создание таблицы пользователей
      preConditions:
        - not:
            - tableExists:
                tableName: users

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: ID пользователя

              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    unique: true
                    nullable: false
                  remarks: Логин пользователя

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    unique: true
                    nullable: false
                  remarks: Электронная почта пользователя

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: Пароль пользователя

              - column:
                  name: first_name
                  type: VARCHAR(50)
                  remarks: Имя пользователя

              - column:
                  name: last_name
                  type: VARCHAR(50)
                  remarks: Фамилия пользователя

              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: USER
                  constraints:
                    nullable: false
                  remarks: Роль пользователя в системе

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false
                  remarks: Статус пользователя

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Временная метка создания записи о пользователе

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Временная метка последнего обновления записи о пользователе

        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email

        - createIndex:
            tableName: users
            indexName: idx_users_username
            columns:
              - column:
                  name: username