databaseChangeLog:
  - changeSet:
      id: create_table_transfer
      author: Roman Kuzmich
      comment: Создание таблицы банковских переводов
      preConditions:
        - not:
            - tableExists:
                tableName: transfers
        - tableExists:
            tableName: cards

      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Transfer ID

              - column:
                  name: from_card_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_from_card
                    referencedTableName: cards
                    referencedColumnNames: id
                  remarks: Source card ID

              - column:
                  name: to_card_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_to_card
                    referencedTableName: cards
                    referencedColumnNames: id
                  remarks: Destination card ID

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
                  remarks: Transfer amount

              - column:
                  name: description
                  type: VARCHAR(255)
                  remarks: Transfer description

              - column:
                  name: timestamp
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Transfer timestamp

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_from_card
            columns:
              - column:
                  name: from_card_id
            remarks: Index for transfer search by source card

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_to_card
            columns:
              - column:
                  name: to_card_id
            remarks: Index for transfer search by destination card

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_timestamp
            columns:
              - column:
                  name: timestamp
            remarks: Index for transfer search by timestamp

        - createIndex:
            tableName: transfers
            indexName: idx_transfers_from_card_timestamp
            columns:
              - column:
                  name: from_card_id
              - column:
                  name: timestamp
            remarks: Index for transfer search by source card and timestamp