databaseChangeLog:
  - changeSet:
      id: create_table_card_block_requests
      author: Roman Kuzmich
      comment: Create table for card block requests
      preConditions:
        - not:
            - tableExists:
                tableName: card_block_requests
        - tableExists:
            tableName: cards
      changes:
        - createTable:
            tableName: card_block_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Card block request ID

              - column:
                  name: card_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Blocking card ID

              - column:
                  name: requested_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: Requester username

              - column:
                  name: requested_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Block request creation timestamp

              - column:
                  name: approved_by
                  type: VARCHAR(100)
                  remarks: Approver username

              - column:
                  name: approved_at
                  type: TIMESTAMP
                  remarks: Block request approve timestamp

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
                  remarks: Block request status (PENDING, APPROVED, REJECTED, CANCELLED)

        - addForeignKeyConstraint:
            baseTableName: card_block_requests
            baseColumnNames: card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_block_request_card
            deferrable: false
            initiallyDeferred: false

        - createIndex:
            tableName: card_block_requests
            indexName: idx_block_requests_card_status
            columns:
              - column:
                  name: card_id
              - column:
                  name: status
            remarks: Index for requests search by card and satus

        - createIndex:
            tableName: card_block_requests
            indexName: idx_block_requests_requested_at
            columns:
              - column:
                  name: requested_at
            remarks: Index for request sort by creation date