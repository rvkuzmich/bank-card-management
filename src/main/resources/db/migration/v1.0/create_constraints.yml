databaseChangeLog:
  - changeSet:
      id: create_constraints
      author: Roman Kuzmich
      preConditions:
        - tableExists:
            tableName: users
        - tableExists:
            tableName: cards
        - tableExists:
            tableName: transfers

      changes:
        - addUniqueConstraint:
            tableName: cards
            columnNames: user_id, cardholder
            constraintName: uk_user_cardholder

        - sql:
            sql: >
              ALTER TABLE cards 
              ADD CONSTRAINT ck_balance_non_negative 
              CHECK (balance >= 0)
        - sql:
            sql: >
              ALTER TABLE cards 
              ADD CONSTRAINT ck_status_valid 
              CHECK (status IN ('ACTIVE', 'BLOCKED', 'EXPIRED'))
        - sql:
            sql: >
              ALTER TABLE transfers 
              ADD CONSTRAINT ck_amount_positive 
              CHECK (amount > 0)
        - sql:
            sql: >
              ALTER TABLE users 
              ADD CONSTRAINT ck_role_valid 
              CHECK (role IN ('USER', 'ADMIN'))