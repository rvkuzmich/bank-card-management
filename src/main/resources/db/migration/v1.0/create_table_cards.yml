databaseChangeLog:
  - changeSet:
      id: create_table_cards
      author: Roman Kuzmich
      comment: Создание таблицы банковских карт
      preConditions:
        - not:
            - tableExists:
                tableName: cards
        - tableExists:
            tableName: users

      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: ID карты

              - column:
                  name: card_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                  remarks: Номер карты

              - column:
                  name: masked_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                  remarks: Маскированный номер карты

              - column:
                  name: cardholder
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: Держатель карты

              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: Срок действия карты

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: Статус карты

              - column:
                  name: balance
                  type: DECIMAL(15,2)
                  defaultValue: 0.00
                  constraints:
                    nullable: false
                  remarks: Баланс карты

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: ID пользователя

              - column:
                  name: blocked_at
                  type: TIMESTAMP
                  remarks: Время блокировки карты

              - column:
                  name: blocked_by
                  type: VARCHAR(100)
                  remarks: Кто заблокировал карту

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Временная метка создания записи о карте

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Временная метка последнего обновления записи о карте

        - addForeignKeyConstraint:
            baseTableName: cards
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_card_user
            validate: true

        - createIndex:
            tableName: cards
            indexName: idx_cards_user
            columns:
              - column:
                  name: user_id
            remarks: Индекс для быстрого поиска карт по пользователю

        - createIndex:
            tableName: cards
            indexName: idx_cards_status
            columns:
              - column:
                  name: status
            remarks: Индекс для фильтрации по статусу карты