databaseChangeLog:
  - changeSet:
      id: create_table_cards
      author: Roman Kuzmich
      comment: Создание таблицы банковских карт
      preConditions:
        - not:
            - tableExists:
                tableName: cards
        - tableExists:
            tableName: users

      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Card ID

              - column:
                  name: card_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                  remarks: Card number

              - column:
                  name: masked_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                  remarks: Masked card number

              - column:
                  name: cardholder
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: Cardholder

              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: Card expiry date

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: Card status

              - column:
                  name: balance
                  type: DECIMAL(15,2)
                  defaultValue: 0.00
                  constraints:
                    nullable: false
                  remarks: Card balance

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: User ID

              - column:
                  name: blocked_at
                  type: TIMESTAMP
                  remarks: Card block timestamp

              - column:
                  name: blocked_by
                  type: VARCHAR(100)
                  remarks: Card blocker username

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Card creation timestamp

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Card last update timestamp

        - addForeignKeyConstraint:
            baseTableName: cards
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_card_user
            validate: true

        - createIndex:
            tableName: cards
            indexName: idx_cards_user
            columns:
              - column:
                  name: user_id
            remarks: Index for card search by user

        - createIndex:
            tableName: cards
            indexName: idx_cards_status
            columns:
              - column:
                  name: status
            remarks: Index for card filtration by status